name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write  # OIDC: npm trusted publishing needs no stored token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2, pinned to a commit SHA (tags can be repointed)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Staged publishing needs npm >= 11.15.0
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match"
            echo "::error::package.json version $PKG_VERSION"
            exit 1
          fi

      # No dependencies to install: tests use Node's built-in runner.
      - name: Test
        run: npm test

      # Staged flow: a maintainer must approve with 2FA before it goes live:
      # `npm stage approve <stage-id>` (or npmjs.com → package → Staged)
      - name: Stage for review
        run: npm stage publish --access public
